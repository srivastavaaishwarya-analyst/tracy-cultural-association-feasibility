name: Module 2 Step 4

on:
  pull_request:
    branches:
      - main
    paths:
      - "sql/**"
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

env:
  REVIEW_FILE: ".github/steps/module-2-review.md"

jobs:
  find_exercise:
    name: Find Module 2 Exercise Issue
    permissions:
      issues: read
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3
    with:
      issue-title-text: "Exercise: Module 2 - Model the Decision Data and Query Scenarios"

  check_step_work:
    name: Check complete SQL exercise and tests
    runs-on: ubuntu-latest
    needs: [find_exercise]
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
    steps:
      - name: Checkout trusted validator
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout learner SQL
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: learner

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Find existing step feedback
        id: find-existing-feedback
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- exercise-feedback:module-2-step-4 -->"
          direction: last

      - name: Find initial progress comment
        id: find-initial-feedback
        if: steps.find-existing-feedback.outputs.comment-id == ''
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: "github-actions[bot]"
          body-includes: "watch your progress in the background"
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-existing-feedback.outputs.comment-id || steps.find-initial-feedback.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      - name: Check all SQL outputs
        id: check-all-sql
        continue-on-error: true
        run: python3 scripts/check_sql_exercise.py --all --root learner

      - name: Run validator unit tests
        id: run-validator-tests
        continue-on-error: true
        run: python3 -m unittest discover -s tests -v

      - name: Update comment - step results
        if: always()
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-existing-feedback.outputs.comment-id || steps.find-initial-feedback.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          vars: |
            step_number: 4
            results_table:
              - description: "All five query outputs match the synthetic data and use the required SQL techniques <!-- exercise-feedback:module-2-step-4 -->"
                passed: ${{ steps.check-all-sql.outcome == 'success' }}
              - description: "SQL validator unit tests pass"
                passed: ${{ steps.run-validator-tests.outcome == 'success' }}

      - name: Fail job if not all checks passed
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_review_content:
    name: Post Module 2 review content
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
    steps:
      - name: Checkout exercise
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Create comment - lesson review
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/lesson-review.md

      - name: Create comment - add review content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.REVIEW_FILE }}

      - name: Disable final workflow
        run: gh workflow disable "${{ github.workflow }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish_exercise:
    name: Finish Module 2 Exercise
    needs: [find_exercise, post_review_content]
    permissions:
      contents: write
      issues: write
    uses: skills/exercise-toolkit/.github/workflows/finish-exercise.yml@v0.9.3
    with:
      issue-url: ${{ needs.find_exercise.outputs.issue-url }}
      exercise-title: "Model the Decision Data and Query Scenarios"
